name: dark-mcp-ail
services:
  redis-cache:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [cache:/data]
  redis-log:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [log:/data]
  redis-queues:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [queues:/data]
  kvrocks:
    image: apache/kvrocks:2.12.1
    user: '0:0'
    entrypoint: [kvrocks, -c, /config/kvrocks.conf]
    volumes:
      - ./data/runtime/kvrocks.conf:/config/kvrocks.conf:ro
      - kvrocks:/data
  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    env_file:
      - path: ./data/runtime/meili.env
        required: false
    volumes: [search:/meili_data]
  ail:
    build:
      context: .
      dockerfile: runtime/Dockerfile.ail
    ports: ['127.0.0.1:7000:7000']
    volumes:
      - ./data/runtime/core.cfg:/opt/ail/configs/core.cfg:ro
      - ./data/ail:/data
    depends_on: [redis-cache, redis-log, redis-queues, kvrocks, meilisearch]
    init: true
  lacus:
    build:
      context: .
      dockerfile: runtime/Dockerfile.lacus
    init: true
    shm_size: 1gb
    volumes: [lacus:/data]
volumes:
  cache:
  log:
  queues:
  kvrocks:
  search:
  lacus:
